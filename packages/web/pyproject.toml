[project]
name = "rio-web"
version = "0.1.0"
description = "Shared FastAPI plumbing: app factory, middleware, problem+json errors, health, DB lifespan/deps."
requires-python = ">=3.12"
dependencies = ["rio-core", "rio-db", "fastapi>=0.115", "httpx>=0.28"]

[tool.uv.sources]
rio-core = { workspace = true }
rio-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rio_web"]
