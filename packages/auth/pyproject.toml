[project]
name = "rio-auth"
version = "0.1.0"
description = "Shared authn primitives: Argon2 hashing, JWT issue/verify, FastAPI principal + service-key dependencies."
requires-python = ">=3.12"
dependencies = ["rio-core", "rio-web", "fastapi>=0.115", "pyjwt>=2.10", "pwdlib[argon2]>=0.2"]

[tool.uv.sources]
rio-core = { workspace = true }
rio-web = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rio_auth"]
