[project]
name = "rio-db"
version = "0.1.0"
description = "Async SQLAlchemy plumbing: Base, mixins, Database facade."
requires-python = ">=3.12"
dependencies = ["sqlalchemy[asyncio]>=2.0.36"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rio_db"]
