[project]
name = "rio-core"
version = "0.1.0"
description = "Cross-cutting primitives: settings, logging, errors, pagination."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10", "pydantic-settings>=2.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rio_core"]
