[project]
name = "api"
version = "0.1.0"
description = "Public HTTP API (FastAPI)."
requires-python = ">=3.12"
dependencies = [
  "rio-core",
  "rio-db",
  "rio-native",
  "fastapi[standard]>=0.115",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pyjwt>=2.10",
  "pwdlib[argon2]>=0.2",
]

[tool.uv.sources]
rio-core = { workspace = true }
rio-db = { workspace = true }
rio-native = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
