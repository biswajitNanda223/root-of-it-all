[project]
name = "billing"
version = "0.1.0"
description = "Billing service."
requires-python = ">=3.12"
dependencies = [
  "rio-core",
  "rio-db",
  "rio-web",
  "rio-auth",
  "fastapi[standard]>=0.115",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20",
  "asyncpg>=0.30",
  "alembic>=1.14",
]

[tool.uv.sources]
rio-core = { workspace = true }
rio-db = { workspace = true }
rio-web = { workspace = true }
rio-auth = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/billing_service"]

[tool.rio.service]
module = "billing_service.main:app_factory"
port = 8003
kind = "domain"
database_env = "BILLING_DATABASE_URL"
database = "billing"

[tool.rio.service.env]
IDENTITY_TOKEN_URL = "http://localhost:8000/api/v1/auth/token"
