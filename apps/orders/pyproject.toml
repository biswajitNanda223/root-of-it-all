[project]
name = "orders"
version = "0.1.0"
description = "Orders service: places orders against the catalog (stock reservation saga) with a transactional outbox."
requires-python = ">=3.12"
dependencies = [
  "rio-core",
  "rio-db",
  "rio-web",
  "rio-auth",
  "fastapi[standard]>=0.115",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "httpx>=0.28",
]

[tool.uv.sources]
rio-core = { workspace = true }
rio-db = { workspace = true }
rio-web = { workspace = true }
rio-auth = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orders_service"]

[tool.rio.service]
module = "orders_service.main:app_factory"
port = 8002
kind = "domain"
database_env = "ORDERS_DATABASE_URL"
database = "orders"
depends_on = ["catalog"]

# extra environment for containers; {catalog} etc. resolve to the in-network URL of that service
[tool.rio.service.env]
CATALOG_URL = "http://catalog:8001"
IDENTITY_TOKEN_URL = "http://localhost:8000/api/v1/auth/token"
