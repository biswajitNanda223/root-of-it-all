[project]
name = "root-of-it-all"
version = "0.1.0"
description = "Production-grade FastAPI monorepo (uv workspace)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["api", "rio-core", "rio-db", "rio-native", "rio-web", "rio-auth", "catalog", "orders"]

# ---------------------------------------------------------------- workspace
[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[tool.uv.sources]
rio-core = { workspace = true }
rio-db = { workspace = true }
rio-native = { workspace = true }
rio-web = { workspace = true }
rio-auth = { workspace = true }
catalog = { workspace = true }
orders = { workspace = true }
api = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "pre-commit>=4.0",
  "httpx>=0.28",
]

# ------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api/src", "apps/api/tests", "apps/catalog/src", "apps/orders/src", "packages/core/src", "packages/db/src", "packages/native/src", "packages/web/src", "packages/auth/src"]
extend-exclude = ["apps/*/migrations/versions", "tooling/templates"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "C4", "PT", "RUF", "N", "TID"]
ignore = ["B008", "E501"]  # B008: FastAPI Depends()/Query() defaults; E501: formatter owns wrapping

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app", "catalog_service", "orders_service", "rio_core", "rio_db", "rio_native", "rio_web", "rio_auth"]

# ------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["apps/api/src", "apps/catalog/src", "apps/orders/src", "packages/core/src", "packages/db/src", "packages/native/src", "packages/web/src", "packages/auth/src"]
explicit_package_bases = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["tests.*", "conftest"]
disallow_untyped_defs = false

# ----------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "apps/api/tests", "apps/catalog/tests", "apps/orders/tests", "packages/core/tests", "packages/native/tests", "packages/web/tests", "packages/auth/tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["apps/api/src", "apps/catalog/src", "apps/orders/src", "packages/core/src", "packages/db/src", "packages/native/src", "packages/web/src", "packages/auth/src"]
branch = true
