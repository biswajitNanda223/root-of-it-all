# GENERATED by tooling/service.py from apps/*/pyproject.toml [tool.rio.service] - do not edit.
name: rio
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rio
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      RIO_DATABASES: "api,catalog,orders"          # one database per service, created on first start
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rio -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    init: true

  api-migrate:
    build:
      context: .
      target: ${RIO_TARGET:-runtime}
      args:
        SERVICE: api
        SERVICE_MODULE: app.main:app_factory
        SERVICE_PORT: "8000"
    image: rio-api:${RIO_TAG:-local}
    command: ["alembic", "upgrade", "head"]
    environment:
      RIO_DATABASE_URL: "postgresql+asyncpg://rio:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/api"
      RIO_SECRET_KEY: "${RIO_SECRET_KEY:-}"
      RIO_SERVICE_KEY: "${RIO_SERVICE_KEY:-}"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: ${RIO_TARGET:-runtime}
      args:
        SERVICE: api
        SERVICE_MODULE: app.main:app_factory
        SERVICE_PORT: "8000"
    image: rio-api:${RIO_TAG:-local}
    environment:
      RIO_DATABASE_URL: "postgresql+asyncpg://rio:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/api"
      RIO_SECRET_KEY: "${RIO_SECRET_KEY:-}"
      RIO_SERVICE_KEY: "${RIO_SERVICE_KEY:-}"
    ports: ["${API_PORT:-8000}:8000"]
    init: true            # tini as PID 1: reaps zombies, forwards SIGTERM
    stop_grace_period: 25s  # > uvicorn --timeout-graceful-shutdown (20s)
    depends_on:
      db:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u,sys; sys.exit(u.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).status != 200)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  catalog-migrate:
    build:
      context: .
      target: ${RIO_TARGET:-runtime}
      args:
        SERVICE: catalog
        SERVICE_MODULE: catalog_service.main:app_factory
        SERVICE_PORT: "8001"
    image: rio-catalog:${RIO_TAG:-local}
    command: ["alembic", "upgrade", "head"]
    environment:
      CATALOG_DATABASE_URL: "postgresql+asyncpg://rio:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/catalog"
      RIO_SECRET_KEY: "${RIO_SECRET_KEY:-}"
      RIO_SERVICE_KEY: "${RIO_SERVICE_KEY:-}"
      IDENTITY_TOKEN_URL: "http://localhost:8000/api/v1/auth/token"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  catalog:
    build:
      context: .
      target: ${RIO_TARGET:-runtime}
      args:
        SERVICE: catalog
        SERVICE_MODULE: catalog_service.main:app_factory
        SERVICE_PORT: "8001"
    image: rio-catalog:${RIO_TAG:-local}
    environment:
      CATALOG_DATABASE_URL: "postgresql+asyncpg://rio:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/catalog"
      RIO_SECRET_KEY: "${RIO_SECRET_KEY:-}"
      RIO_SERVICE_KEY: "${RIO_SERVICE_KEY:-}"
      IDENTITY_TOKEN_URL: "http://localhost:8000/api/v1/auth/token"
    ports: ["${CATALOG_PORT:-8001}:8001"]
    init: true            # tini as PID 1: reaps zombies, forwards SIGTERM
    stop_grace_period: 25s  # > uvicorn --timeout-graceful-shutdown (20s)
    depends_on:
      db:
        condition: service_healthy
      catalog-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u,sys; sys.exit(u.urlopen('http://127.0.0.1:8001/health/ready', timeout=2).status != 200)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  orders-migrate:
    build:
      context: .
      target: ${RIO_TARGET:-runtime}
      args:
        SERVICE: orders
        SERVICE_MODULE: orders_service.main:app_factory
        SERVICE_PORT: "8002"
    image: rio-orders:${RIO_TAG:-local}
    command: ["alembic", "upgrade", "head"]
    environment:
      ORDERS_DATABASE_URL: "postgresql+asyncpg://rio:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/orders"
      RIO_SECRET_KEY: "${RIO_SECRET_KEY:-}"
      RIO_SERVICE_KEY: "${RIO_SERVICE_KEY:-}"
      CATALOG_URL: "http://catalog:8001"
      IDENTITY_TOKEN_URL: "http://localhost:8000/api/v1/auth/token"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  orders:
    build:
      context: .
      target: ${RIO_TARGET:-runtime}
      args:
        SERVICE: orders
        SERVICE_MODULE: orders_service.main:app_factory
        SERVICE_PORT: "8002"
    image: rio-orders:${RIO_TAG:-local}
    environment:
      ORDERS_DATABASE_URL: "postgresql+asyncpg://rio:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/orders"
      RIO_SECRET_KEY: "${RIO_SECRET_KEY:-}"
      RIO_SERVICE_KEY: "${RIO_SERVICE_KEY:-}"
      CATALOG_URL: "http://catalog:8001"
      IDENTITY_TOKEN_URL: "http://localhost:8000/api/v1/auth/token"
    ports: ["${ORDERS_PORT:-8002}:8002"]
    init: true            # tini as PID 1: reaps zombies, forwards SIGTERM
    stop_grace_period: 25s  # > uvicorn --timeout-graceful-shutdown (20s)
    depends_on:
      db:
        condition: service_healthy
      orders-migrate:
        condition: service_completed_successfully
      catalog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u,sys; sys.exit(u.urlopen('http://127.0.0.1:8002/health/ready', timeout=2).status != 200)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
