name: ci
on:
  push: { branches: [main] }
  pull_request:
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: sudo apt-get update && sudo apt-get install -y clang lld
      - run: scripts/bootstrap.sh
      - run: scripts/check.sh

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: staging
          load: true
          tags: rio-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 \
            -e RIO_SECRET_KEY=ci-secret-ci-secret-ci-secret-00 \
            -e RIO_DATABASE_URL=sqlite+aiosqlite:////tmp/ci.db -e RIO_AUTO_CREATE_TABLES=true rio-api:ci
          for i in $(seq 1 20); do curl -fs localhost:8000/health/ready && exit 0; sleep 1; done
          docker logs api; exit 1
