name: ci
on:
  push: { branches: [main] }
  pull_request:
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }

jobs:
  # ---------------------------------------------------------------- commit hygiene
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Conventional Commits (PR title + every commit)
        env: { PR_TITLE: "${{ github.event.pull_request.title }}" }
        run: |
          python3 scripts/hooks/commit_msg.py --text "$PR_TITLE"
          for sha in $(git rev-list origin/${{ github.base_ref }}..HEAD); do
            git log -1 --format=%B "$sha" > /tmp/msg
            python3 scripts/hooks/commit_msg.py /tmp/msg || { echo "bad commit $sha"; exit 1; }
          done
      - name: Secret scan
        run: git diff --name-only origin/${{ github.base_ref }}...HEAD | xargs -r python3 scripts/hooks/scan_secrets.py

  # ------------------------------------------------------- which projects changed?
  changes:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.a.outputs.projects }}
      docker: ${{ steps.a.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: a
        run: |
          base="origin/${{ github.base_ref || 'main' }}"
          [ "${{ github.event_name }}" = push ] && base="HEAD~1"
          projects=$(python3 tooling/affected.py --base "$base" --json)
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          # image only needs rebuilding when runtime inputs change
          if git diff --name-only "$base"...HEAD | grep -qE '^(Dockerfile|docker-bake.hcl|uv.lock|pyproject.toml|apps/|packages/|tooling/lld/)'; then
            echo docker=true >> "$GITHUB_OUTPUT"; else echo docker=false >> "$GITHUB_OUTPUT"; fi

  check:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: sudo apt-get update && sudo apt-get install -y clang lld shellcheck
      - run: LLD_PROFILE=release scripts/lld-doctor.sh packages/native release
      - run: scripts/bootstrap.sh
      - run: shellcheck --severity=warning -x scripts/*.sh scripts/hooks/*.sh tooling/lld/load.sh
      - run: scripts/check.sh
      - name: OpenAPI contract is committed and fresh
        run: scripts/export-openapi.sh && git diff --exit-code docs/openapi.json

  # ------------------------------------------------------------------ docker
  docker:
    needs: [changes, check]
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: Dockerfile, failure-threshold: warning }
      - name: Gate inside the image (lint + types + tests, lld dev profile)
        uses: docker/bake-action@v6
        with: { targets: test }
        env: { GIT_SHA: "${{ github.sha }}" }
      - name: Build staging (same shape as prod)
        uses: docker/bake-action@v6
        with:
          targets: staging
          load: true
          set: |
            *.platform=linux/amd64
            *.attest=
        env: { GIT_SHA: "${{ github.sha }}" }
      - name: Image size budget (< 200 MB) and non-root
        run: |
          img=$(docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | head -3); echo "$img"
          bytes=$(docker image inspect ghcr.io/biswajitnanda223/root-of-it-all/api:staging --format '{{.Size}}')
          [ "$bytes" -lt 209715200 ] || { echo "image too large: $bytes"; exit 1; }
          [ "$(docker run --rm --entrypoint id ghcr.io/biswajitnanda223/root-of-it-all/api:staging -u)" = 10001 ]
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 \
            -e RIO_SECRET_KEY=ci-secret-ci-secret-ci-secret-00 \
            -e RIO_DATABASE_URL=sqlite+aiosqlite:////tmp/ci.db -e RIO_AUTO_CREATE_TABLES=true \
            ghcr.io/biswajitnanda223/root-of-it-all/api:staging
          for i in $(seq 1 30); do curl -fs localhost:8000/health/ready && break; sleep 1; done
          curl -fs localhost:8000/openapi.json >/dev/null && curl -fs localhost:8000/api/v1/playground/params/path/1
          docker logs api
