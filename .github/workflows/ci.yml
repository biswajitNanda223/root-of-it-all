name: ci
on:
  push: { branches: [main] }
  pull_request:
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }

jobs:
  # ---------------------------------------------------------------- commit hygiene
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Conventional Commits (PR title + every commit)
        env: { PR_TITLE: "${{ github.event.pull_request.title }}" }
        run: |
          python3 scripts/hooks/commit_msg.py --text "$PR_TITLE"
          for sha in $(git rev-list origin/${{ github.base_ref }}..HEAD); do
            git log -1 --format=%B "$sha" > /tmp/msg
            python3 scripts/hooks/commit_msg.py /tmp/msg || { echo "bad commit $sha"; exit 1; }
          done
      - name: dotenvx hygiene (encrypted env files, no keys)
        run: git ls-files '.env*' | grep -v '^.env.example$' | xargs -r python3 scripts/hooks/check_dotenvx.py
      - name: Secret scan
        run: git diff --name-only origin/${{ github.base_ref }}...HEAD | xargs -r python3 scripts/hooks/scan_secrets.py

  # ------------------------------------------------------- which projects changed?
  changes:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.a.outputs.projects }}
      services: ${{ steps.a.outputs.services }}
      docker: ${{ steps.a.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: a
        run: |
          base="origin/${{ github.base_ref || 'main' }}"
          [ "${{ github.event_name }}" = push ] && base="HEAD~1"
          projects=$(python3 tooling/affected.py --base "$base" --json)
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          # only apps/* become images; library changes already pull in every app that depends on them
          echo "services=$(echo "$projects" | jq -c '[.[] | select(startswith("apps/")) | sub("apps/"; "")]')" >> "$GITHUB_OUTPUT"
          # image only needs rebuilding when runtime inputs change
          if git diff --name-only "$base"...HEAD | grep -qE '^(Dockerfile|docker-bake.hcl|uv.lock|pyproject.toml|apps/|packages/|tooling/lld/)'; then
            echo docker=true >> "$GITHUB_OUTPUT"; else echo docker=false >> "$GITHUB_OUTPUT"; fi

  check:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: sudo apt-get update && sudo apt-get install -y clang lld shellcheck
      - run: LLD_PROFILE=release scripts/lld-doctor.sh packages/native release
      - run: scripts/bootstrap.sh
      - run: shellcheck --severity=warning -x scripts/*.sh scripts/hooks/*.sh tooling/lld/load.sh
      - run: scripts/check.sh
      - name: OpenAPI contract is committed and fresh
        run: scripts/export-openapi.sh && git diff --exit-code docs/openapi

  # ------------------------------------------------------------------ docker
  gate:
    needs: [changes, check]
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: Dockerfile, failure-threshold: warning }
      - name: Gate inside the image (lint + types + all tests, lld dev profile)
        uses: docker/bake-action@v6
        with:
          files: docker-bake.hcl,docker-bake.services.hcl
          targets: test
        env: { GIT_SHA: "${{ github.sha }}" }

  images:
    # One job per AFFECTED service: a change to catalog does not rebuild orders (unless a shared package changed).
    needs: [changes, gate]
    if: needs.changes.outputs.docker == 'true' && needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { service: "${{ fromJson(needs.changes.outputs.services) }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build staging image (same shape as prod)
        uses: docker/bake-action@v6
        with:
          files: docker-bake.hcl,docker-bake.services.hcl
          targets: staging-${{ matrix.service }}
          load: true
          set: |
            *.platform=linux/amd64
            *.attest=
        env: { GIT_SHA: "${{ github.sha }}" }
      - name: Image budget (< 200 MB) and non-root
        run: |
          img=ghcr.io/biswajitnanda223/root-of-it-all/${{ matrix.service }}:staging
          bytes=$(docker image inspect "$img" --format '{{.Size}}')
          echo "$img = $bytes bytes"
          [ "$bytes" -lt 209715200 ] || { echo "image too large"; exit 1; }
          [ "$(docker run --rm --entrypoint id "$img" -u)" = 10001 ]
      - name: Smoke test
        run: |
          port=$(python3 tooling/service.py get ${{ matrix.service }} port)
          docker run -d --name svc -p "$port:$port" \
            -e RIO_SECRET_KEY=ci-secret-ci-secret-ci-secret-00 -e RIO_SERVICE_KEY=ci-service-key \
            -e "$(python3 tooling/service.py get ${{ matrix.service }} database_env)=sqlite+aiosqlite:////tmp/ci.db" \
            -e RIO_AUTO_CREATE_TABLES=true \
            ghcr.io/biswajitnanda223/root-of-it-all/${{ matrix.service }}:staging
          for i in $(seq 1 30); do curl -fs "localhost:$port/health/ready" && break; sleep 1; done
          curl -fs "localhost:$port/openapi.json" >/dev/null
          docker logs svc
